[options]
; Solo addons_path y opciones de UI/dev.
; La conexión a la BD la maneja el entrypoint del contenedor oficial
; leyendo las env vars HOST / PORT / USER / PASSWORD del docker-compose.
addons_path = /mnt/extra-addons
http_port = 8069
admin_passwd = admin123
list_db = True

; La SPA llama a /ne/api/* SIN fijar BD en la request. Con >1 BD en el server (p.ej.
; 'odoo_test_ci' que deja una corrida de tests) Odoo no puede monodb-rutear y esas
; rutas devuelven 404 ("No database is selected") → el login del front se rompe.
; Fijamos la BD del stack local (la que crea levantar-docker.sh) para que siempre
; resuelva, sin importar qué otras BDs de test convivan. Solo afecta al docker local.
dbfilter = ^odoo_ne_biller$

; Para multi-tenant en producción descomentar (y quitar el dbfilter de arriba):
; list_db = False
; dbfilter = ^%h$
